services:
  - type: web
    name: fluxocaixa
    env: python
    buildCommand: "pip install -r requirements.txt"
    # --preload: o app (migrações Alembic + seeds + SECRET_KEY) inicializa UMA vez
    # no master antes do fork — evita migração/seed concorrente entre workers e
    # garante a mesma chave de sessão quando SECRET_KEY não é definida.
    # --workers 1: o agendador de extração embutido (EXTRACAO_SCHEDULER) roda no
    # lifespan de cada worker — com N workers as fontes executariam N vezes.
    # Para escalar workers, desabilite EXTRACAO_SCHEDULER e dispare via API.
    startCommand: "gunicorn src.fluxocaixa.main:app --preload --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHONPATH
        value: src
      - key: DATABASE_URL
        value: sqlite:///./instance/fluxo.db
      - key: PYTHON_VERSION # O código usa sintaxe PEP 604 (int | None): requer >= 3.10
        value: "3.10"
      # AUTO_MIGRATE (default true): aplica migrações Alembic no boot.
      # SEED_DEMO_DATA (default true): mantém os dados de demonstração da demo hospedada.
      # Em instalação com dados reais (ex.: SEFAZ), defina SEED_DEMO_DATA=false.
      # - key: AUTO_MIGRATE
      #   value: "true"
      # - key: SEED_DEMO_DATA
      #   value: "true"
      # DEMO_MODE — DEFINA NO PAINEL DO PROVEDOR, NUNCA AQUI.
      # Este arquivo é VERSIONADO: ligar a flag aqui faria todo fork herdar a
      # demonstração pública em produção, com admin/admin na tela de login e a
      # troca de senha recusada — ou seja, sem nem conseguir se proteger depois.
      # O default `false` é o que mantém o fork seguro; a instância de demo
      # declara a exceção no seu próprio ambiente.
      # O boot ABORTA se DEMO_MODE vier com SEED_DEMO_DATA=false ou APP_ENV=prod
      # (infraestrutura-banco R10) — combinações sem uso legítimo.
      # Autenticação — defina no painel (sync: false), nunca neste arquivo.
      # SECRET_KEY é OBRIGATÓRIA com APP_ENV=prod: o boot aborta sem ela, porque
      # a chave aleatória por processo mata as sessões a cada deploy e quebra a
      # autenticação em silêncio com mais de um worker.
      # ADMIN_INITIAL_PASSWORD: sem ela a senha inicial é ALEATÓRIA e vai uma
      # única vez para o log do boot.
      # APP_ENV: o cookie `Secure` agora é o DEFAULT (desligado só em `dev`).
      # - key: SECRET_KEY
      #   sync: false
      # - key: ADMIN_INITIAL_PASSWORD
      #   sync: false
      # - key: APP_ENV
      #   value: "prod"

