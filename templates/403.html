<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso negado — Fluxo de Caixa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .cartao {
            background: #fff; border-radius: 12px; padding: 40px 36px;
            width: 100%; max-width: 440px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,.35);
        }
        .icone { font-size: 42px; margin-bottom: 10px; }
        h1 { font-size: 20px; color: #0f172a; margin-bottom: 8px; }
        p { color: #64748b; font-size: 14px; line-height: 1.5; }
        code {
            display: inline-block; margin: 12px 0; padding: 4px 10px;
            background: #f1f5f9; border-radius: 6px; color: #b91c1c;
            font-size: 13px;
        }
        a {
            display: inline-block; margin-top: 16px; padding: 10px 22px;
            background: #2563eb; color: #fff; border-radius: 8px;
            text-decoration: none; font-size: 14px; font-weight: 600;
        }
        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="cartao" data-testid="pagina-403">
        <div class="icone">🔒</div>
        <h1>Acesso negado</h1>
        <p>Seu perfil não possui a permissão necessária para esta funcionalidade:</p>
        <code data-testid="permissao-necessaria">{{ permissao }}</code>
        <p>Se precisar deste acesso, solicite ao administrador do sistema.</p>
        <a href="/" data-testid="voltar-inicio">Voltar ao início</a>
    </div>
</body>
</html>
